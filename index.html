<!DOCTYPE html>
<html>
<head>
  <title>GST Login Portal</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      padding:0;
      font-family:Arial;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:white;
      padding:40px;
      border-radius:15px;
      text-align:center;
      box-shadow:0px 0px 15px rgba(0,0,0,0.1);
      width:320px;
    }

    h1{
      color:#1a237e;
      margin-bottom:10px;
    }

    p{
      color:#555;
      margin-bottom:30px;
    }

    .btn{
      background:#0d6efd;
      color:white;
      padding:15px 25px;
      text-decoration:none;
      border-radius:8px;
      font-size:18px;
      display:inline-block;
    }

    .btn:hover{
      background:#084298;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>GST Portal</h1>

  <p>Click below to Login GST Portal</p>

  <a class="btn"
     href="https://services.gst.gov.in/services/login"
     target="_blank">

     Login GST

  </a>

</div>

</body>
</html>
